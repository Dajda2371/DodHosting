# Coolify: Servers > <server> > Proxy > Dynamic Configurations > add file "dod-wildcard.yaml".
# Makes Traefik request ONE wildcard certificate for *.ai-dod-spse.davidbenes.cz through the
# DNS challenge. Requires the "letsencrypt" resolver to be switched to dnsChallenge first (see README).
# The router below only exists to trigger issuance; Traefik then serves this certificate for every
# matching host (visitor sites and deploy.*), so no per-site certificates are requested.
http:
  routers:
    dod-wildcard-cert:
      entryPoints:
        - https
      rule: Host(`cert.ai-dod-spse.davidbenes.cz`)
      service: noop@internal
      tls:
        certResolver: letsencrypt
        domains:
          - main: ai-dod-spse.davidbenes.cz
            sans:
              - "*.ai-dod-spse.davidbenes.cz"
