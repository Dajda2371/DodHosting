; Hardening for visitor-generated PHP
expose_php = Off
display_errors = On
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 64M
max_execution_time = 5
max_input_time = 5
post_max_size = 2M
upload_max_filesize = 1M
max_file_uploads = 2
file_uploads = On
allow_url_fopen = Off
allow_url_include = Off
session.save_path = /tmp
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,proc_nice,proc_terminate,proc_get_status,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_alarm,mail,mb_send_mail,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,socket_create,dl,putenv,ini_set,ini_alter,set_time_limit,ignore_user_abort,symlink,link,chmod,chown,chgrp,posix_kill,posix_setuid,posix_setgid,posix_mkfifo,phpinfo,apache_setenv
user_ini.filename =
