# Coolify resource: one compose stack for all visitor sites.
# In Coolify set ONE domain: deployer -> https://deploy.ai-dod-spse.davidbenes.cz, port 8080.
# The visitor sites (*.ai-dod-spse.davidbenes.cz) are routed by the Traefik labels on `web` below,
# because Coolify's domain field does not accept wildcards. TLS uses the wildcard certificate from
# the proxy's dynamic config (see coolify/issue-wildcard-cert.sh).
services:
  web:
    build: ./web
    restart: unless-stopped
    volumes:
      - sites:/sites:ro
    networks: [default, sandbox]
    depends_on: [php]
    labels:
      - traefik.enable=true
      # The network Coolify attaches the proxy to is named after the resource UUID. Without this,
      # Traefik may pick the internal `sandbox` network, which it can't reach. Update it if the
      # Coolify resource is ever recreated.
      - traefik.docker.network=1wqyvgpdb6mqamma8biv75hs
      - traefik.http.middlewares.dod-to-https.redirectscheme.scheme=https
      # priority=1 so Coolify's own router for deploy.ai-dod-spse… always wins.
      - 'traefik.http.routers.dod-sites-http.rule=HostRegexp(`^[a-z0-9-]+\.ai-dod-spse\.davidbenes\.cz`)'
      - traefik.http.routers.dod-sites-http.entrypoints=http
      - traefik.http.routers.dod-sites-http.priority=1
      - traefik.http.routers.dod-sites-http.middlewares=dod-to-https
      - traefik.http.routers.dod-sites-http.service=dod-sites
      - 'traefik.http.routers.dod-sites.rule=HostRegexp(`^[a-z0-9-]+\.ai-dod-spse\.davidbenes\.cz`)'
      - traefik.http.routers.dod-sites.entrypoints=https
      - traefik.http.routers.dod-sites.priority=1
      - traefik.http.routers.dod-sites.tls=true
      - traefik.http.routers.dod-sites.service=dod-sites
      - traefik.http.services.dod-sites.loadbalancer.server.port=80

  php:
    build: ./php
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - sites:/sites
    networks: [sandbox]          # internal only: no outbound internet
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  deployer:
    build:
      context: .
      dockerfile: deployer/Dockerfile
    restart: unless-stopped
    environment:
      EVENT_TOKEN: ${EVENT_TOKEN:?set EVENT_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SITE_DOMAIN: ${SITE_DOMAIN:-ai-dod-spse.davidbenes.cz}
      SITE_SCHEME: ${SITE_SCHEME:-https}
      SITE_TTL_DAYS: ${SITE_TTL_DAYS:-14}
      SITES_DIR: /sites
      META_DIR: /meta
    volumes:
      - sites:/sites
      - meta:/meta

volumes:
  sites:
  meta:

networks:
  sandbox:
    internal: true
